services:
  - type: web
    name: trendpulse-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./trendpulse.db # Fallback to SQLite; sync with Neon PostgreSQL in production
      - key: API_KEY
        value: dev_secret_key_123
      - key: ALPACA_API_KEY
        sync: false # Requires manual user value in Render dashboard
      - key: ALPACA_SECRET_KEY
        sync: false # Requires manual user value in Render dashboard
